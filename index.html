<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JECR | Portafolio Profesional</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        h1 {
            color: #58a6ff;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        p {
            font-size: 1.2rem;
            color: #8b949e;
            line-height: 1.6;
        }
        .badge {
            background-color: #21262d;
            border: 1px solid #30363d;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #58a6ff;
        }
        .links a {
            color: #58a6ff;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">Estudiante Universitario</span>
        <h1>JECR</h1>
        <p>Bienvenido a mi espacio digital profesional. Actualmente construyendo mi portafolio académico y de proyectos en ingeniería y desarrollo.</p>
        <hr style="border: 0; border-top: 1px solid #30363d; margin: 2rem 0;">
        <div class="links">
            <a href="mailto:contacto@jecr.cl">Contacto</a>
            <a href="https://linkedin.com" target="_blank">LinkedIn</a>
            <a href="https://github.com" target="_blank">GitHub</a>
        </div>
    </div>
</body>
</html>
